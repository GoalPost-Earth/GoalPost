  # @private: the vector is derived from GOAL-275-gated profile content
  # (description, passions, traits) — an ungated readable copy would undo the
  # field gates (embedding inversion recovers short texts). No client selects
  # it; server-side vector search reads it via Cypher, which @private ignores.
  embedding: [Float!] @private
  signupDate: DateTime

  # Onboarding (modern schema)
  onboardingCurrentStepIndex: Int
  onboardingCompletedSteps: [String!]
  onboardingIsCompleted: Boolean
  onboardingSkipped: Boolean

  # Persisted focal entity. Mirrors the client-side FocalEntityContext so
  # the user's "where I last was" survives a fresh browser / new device.
  # All four are written together on every change; null when no focal is set.
  # Type is one of the FocalEntityType discriminators
  # (MeSpace/WeSpace/FieldContext/User/PersonPulse/<Pulse subtype>) —
  # validated server-side via isFocalEntityType.
  lastFocalType: String
  lastFocalId: String
  lastFocalLabel: String
  lastFocalAt: DateTime

  # Timestamps
  createdAt: DateTime!
    @timestamp(operations: [CREATE])
    @settable(onCreate: true, onUpdate: false)
  updatedAt: DateTime
    @timestamp(operations: [UPDATE])
    @settable(onCreate: false, onUpdate: true)

  # Modern relationships (pulse-first architecture)
  ownsSpaces: [Space!]! @relationship(type: "OWNS", direction: OUT)
  memberOf: [SpaceMembership!]! @relationship(type: "IS_MEMBER", direction: IN)

  # Legacy relationships (preserved for migration)
  # NOTE: Person-to-person connections should migrate to ResonanceLinks.
  # Both fields carry the SAME GOAL-275 gate as the PII scalars: the connection
  # graph + narrative (`why`/`interests`) are only readable when the caller is
  # the person or shares a Space with them. Each endpoint in the returned
  # `connections` list is itself a Person, so its own PII re-enters the
  # field-auth gate and stays independently scoped.
  connections: [Person!]!
    @cypher(
      statement: """
      MATCH (this)-[:CONNECTED_TO]-(other:Person)
      RETURN other
      """
      columnName: "other"
    )
    @authorization(filter: [{ operations: [READ], where: { node: { OR: [
      { id_EQ: "$jwt.user.id" }
      { createdBy_SOME: { id_EQ: "$jwt.user.id" } }
      { ownsSpaces_SOME: { OR: [ { owner_SOME: { id_EQ: "$jwt.user.id" } } { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } ] } }
      { memberOf_SOME: { space_SOME: { OR: [ { owner_SOME: { id_EQ: "$jwt.user.id" } } { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } ] } } }
      { contexts_SOME: { OR: [ { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } } { meSpace_SOME: { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } } { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } } { weSpace_SOME: { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } } ] } }
    ] } } }])
  connectionEdges: [PersonConnectionEdge!]!
    @cypher(
      statement: """
      MATCH (this)-[r:CONNECTED_TO]-(other:Person)
      RETURN {connectedPersonId: other.id, why: r.why, interests: r.interests} AS connectionEdge
      """
      columnName: "connectionEdge"
    )
    @authorization(filter: [{ operations: [READ], where: { node: { OR: [
      { id_EQ: "$jwt.user.id" }
      { createdBy_SOME: { id_EQ: "$jwt.user.id" } }
      { ownsSpaces_SOME: { OR: [ { owner_SOME: { id_EQ: "$jwt.user.id" } } { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } ] } }
      { memberOf_SOME: { space_SOME: { OR: [ { owner_SOME: { id_EQ: "$jwt.user.id" } } { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } ] } } }
      { contexts_SOME: { OR: [ { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } } { meSpace_SOME: { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } } { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } } { weSpace_SOME: { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } } ] } }
    ] } } }])
  
  # PULSE ACCESS: Pulses are accessed through FieldContexts in owned/member Spaces
  # To get a person's pulses:
  #   1. Query ownsSpaces → get MeSpaces/WeSpaces
  #   2. Query contexts on those spaces → get FieldContexts
  #   3. Query pulses on those contexts → get GoalPulse/ResourcePulse/StoryPulse
  # Same HAS_PERSON write-gate as FieldContext.people, from the Person side:
  # updatePeople's UPDATE validate limits the target to the caller's own node,
  # but an open nested CONNECT here still let a caller inject THEMSELVES into
  # any FieldContext by id. Attach flows go through `addPersonToFieldContext`.
  contexts: [FieldContext!]!
    @relationship(
      type: "HAS_PERSON"
      direction: IN
      nestedOperations: [DISCONNECT]
    )
  #
  # MIGRATION: Legacy direct pulse relationships (goals, resources, coreValues, carePoints)
  # are transformed into pulses within FieldContexts in the person's auto-created MeSpace.

  createdBy: [Person!]! @relationship(type: "CREATED_BY", direction: OUT)
  """
  Documents this person was extracted from (doc-ingestion provenance — see GOAL-242 + ADR-0002).
  Empty for manually-created Person nodes. Each Document is auth-filtered via its own
  @authorization directive, so non-members of the parent Space see an empty list even if
  the underlying EXTRACTED_FROM edge exists.
  """
  extractedFrom: [Document!]! @relationship(type: "EXTRACTED_FROM", direction: OUT)
  """
  Pulses (goal/resource/story) this person was identified as related to / named
  in but is not the author of (GOAL-298, MENTIONED_IN). Each FieldPulse is
  auth-filtered by its own directive, so a non-member of the parent Space sees an
  empty list. Written server-side by the doc-ingestion link path; open nested
  CONNECT is disabled.
  """
  mentionedIn: [FieldPulse!]!
    @relationship(
      type: "MENTIONED_IN"
      direction: OUT
      nestedOperations: [DISCONNECT]
    )
}

"""
User authentication and preferences.
Extends Person with login and feature flags.
Multi-label: ["Person", "User"]
Authorization: the auto-generated `users` READ query is disabled (GOAL-275).
Every :User node also carries the :Person label, so it is readable through the
`people` query — where the Person type's field-level PII gate applies. Exposing
a second, UNGATED read path here (`users { email … }`) let any authenticated
caller enumerate every registered account's PII, bypassing that gate. Legitimate
by-email member lookup goes through the narrow, exact-match `findUserByEmail`
resolver (user-lookup-resolver.ts), not a broad `users` scan.
"""
type User implements PersonInterface
  @node(labels: ["Person", "User"])
  # Disable the auto-generated `users` / `usersConnection` / `usersAggregate`
  # READ queries. This is the READ half of GOAL-275: without it, the ungated
  # User type re-opens the cross-Space PII leak that the Person field-auth gate
  # closes (a :User is the same node as a :Person, just addressed by a second
  # GraphQL type). :User nodes stay readable — gated — via `people`.
  @query(read: false, aggregate: false)
  # Drop the auto-generated `createUsers` mutation entirely. A :User carries
  # auth state (password, refreshToken) and is the login identity, so an
  # ungated create let any authenticated token holder mint an arbitrary
  # account with a chosen email + password outside the normalized signup
  # path. :User nodes are only ever created by the trusted auth routes
  # (signup / accept-invite) via direct Cypher. UPDATE/DELETE stay (still
  # owner-scoped by the @authorization below). Mirrors the MeSpace pattern.
  @mutation(operations: [UPDATE, DELETE])
  @authorization(
    # Same owner-scoping as Person. The User type additionally exposes auth
    # fields (password / refreshToken are @private), so gating updateUsers /
    # deleteUsers to the authenticated user is critical — otherwise any token
    # holder could rewrite another account. Auth routes mutate these via
    # direct Cypher, not GraphQL, so they are unaffected.
    validate: [
      {
        operations: [UPDATE, DELETE]
        where: { node: { id_EQ: "$jwt.user.id" } }
      }
    ]
  ) {
  id: ID! @id
  firstName: String!
  lastName: String!
  name: String! @customResolver(requires: "firstName lastName")
  email: String
  
  # Profile properties
  photo: String
  phone: String
  pronouns: String
  location: String
  avatar: String
  status: String
  gender: String
  
  # Rich profile content
  passions: String
  traits: String
  fieldsOfCare: String
  interests: String
  
  # Authentication & preferences
  aiEnabled: Boolean!
  password: String @private
  refreshToken: String @private
  refreshTokenExp: DateTime
  refreshTokenRevoked: Boolean
  authId: String
  # @private: same rationale as Person.embedding — derived from gated content.
  embedding: [Float!] @private
  signupDate: DateTime

  # Onboarding
  onboardingCurrentStepIndex: Int!
  onboardingCompletedSteps: [String!]!
  onboardingIsCompleted: Boolean!
  onboardingSkipped: Boolean!
  
  # Timestamps
  createdAt: DateTime!
    @timestamp(operations: [CREATE])
    @settable(onCreate: true, onUpdate: false)
  updatedAt: DateTime
    @timestamp(operations: [UPDATE])
    @settable(onCreate: false, onUpdate: true)
  
  ownsSpaces: [Space!]! @relationship(type: "OWNS", direction: OUT)
}

"""
Anything that can initiate pulses or own spaces.
Query-time abstraction.

MIGRATION NOTES:

1. Community Transformation:
   - Community nodes → WeSpace nodes with merged properties
   - BELONGS_TO relationships → SpaceMembership nodes with appropriate roles
   - Community owners → Space owners via OWNS relationship

2. Pulse Creation Pattern:
   - User pulses: Create FieldContext in auto-created MeSpace ("{User's name} MeSpace")
   - Community pulses: Create FieldContext ("{Community name} Field") in WeSpace
   - All pulses live ONLY within FieldContexts
   - Pulse relationships → ResonanceLinks within the FieldContext

3. Example Migration:
   Person "Alice" MOTIVATED_BY Goal "Launch App" →
     a. Create MeSpace "Alice MeSpace" (owner: Alice)
     b. Create FieldContext "Alice's Goals" in MeSpace
     c. Create GoalPulse "Launch App" in FieldContext
     d. Alice can access via: ownsSpaces → contexts → pulses
   
   Community "Tech Team" MOTIVATED_BY Goal "Ship v2.0" →
     a. Create WeSpace "Tech Team" with community properties
     b. Create FieldContext "Tech Team Field" in WeSpace
     c. Create GoalPulse "Ship v2.0" in FieldContext
     d. Members can access via: memberOf → space → contexts → pulses
"""
# @query(read: false): same reason as PersonInterface — this union's
# auto-generated `lifeSensors` root reads `:Person` nodes without the
# GOAL-275 field-auth gate, leaking cross-Space PII. Unused by the app
# (the schema-graph page shows a static "LifeSensors" label, not a query).
union LifeSensor @query(read: false) = Person

# ============================================================================
# SPACES (Privacy + Ownership Boundary)
# ============================================================================

"""
Abstract space type.
Never instantiated directly - use MeSpace or WeSpace.
Expanded with Community properties from reference schema.
"""
interface Space {
  id: ID!
  name: String!
  visibility: SpaceVisibility!
  
  # Merged community properties
  description: String
  why: String
  location: String
  time: String
  activities: String
  resultsAchieved: String
  status: String
  
  createdAt: DateTime!
  owner: [Person!]! @declareRelationship
  members: [SpaceMembership!]! @declareRelationship
  contexts: [FieldContext!]! @declareRelationship
}

"""
A personal space owned by one person.
Can be private (only owner) or shared with specific members.
Multi-label: ["Space", "MeSpace"]
Authorization: Only the owner can view, create, update, or delete a MeSpace.
"""
type MeSpace implements Space
  @node(labels: ["Space", "MeSpace"])
  # Disables the auto-generated `createMeSpaces` root mutation.
  # All MeSpace creation MUST go through /api/me-space/create which
  # enforces the "one per Person" invariant atomically (with WHERE NOT
  # EXISTS) and denormalizes `ownerId` so the DB UNIQUE constraint
  # (see scripts/init-db.js → mespace_owner_unique) holds. Allowing
  # CREATE here would let an authenticated user spawn a second MeSpace
  # via the Apollo client / GraphQL playground, bypassing the guard.
  # See kb/03-workflows.md:41 and kb/05-data-entities.md for the rule.
  @mutation(operations: [UPDATE, DELETE])
  @authorization(
    filter: [{ where: { node: { owner_SOME: { id_EQ: "$jwt.user.id" } } } }]
  ) {
  id: ID! @id
  name: String!
  visibility: SpaceVisibility!
  
  # Community properties
  description: String
  why: String
  location: String
  time: String
  activities: String
  resultsAchieved: String
  status: String
  
  createdAt: DateTime!
  owner: [Person!]! @relationship(type: "OWNS", direction: IN)
  members: [SpaceMembership!]! @relationship(type: "HAS_MEMBER", direction: OUT)
  # Nested DELETE/DISCONNECT are disabled (GOAL-319): a nested
  # `contexts: { delete: ... }` ran the same bare DETACH DELETE the removed
  # deleteFieldContexts mutation did (orphaning every nested pulse), and a
  # nested disconnect stranded the context invisible AND un-purgeable (the
  # purge cron matches on deletedAt, which a disconnect never sets). All
  # deletion flows through the custom `deleteFieldContext` mutation.
  contexts: [FieldContext!]!
    @relationship(
      type: "HAS_CONTEXT"
      direction: OUT
      nestedOperations: [CONNECT, CREATE, UPDATE]
    )
}

"""
A collaborative space shared with other people.
Has an owner and members who can all participate.
Multi-label: ["Space", "WeSpace"]
Authorization: Owner and members can access. Non-members cannot.
"""
type WeSpace implements Space
  @node(labels: ["Space", "WeSpace"])
  @authorization(
    # READ — owner or any member can see the space.
    filter: [
      {
        where: {
          node: {
            OR: [
              { owner_SOME: { id_EQ: "$jwt.user.id" } }
              { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } }
            ]
          }
        }
      }
    ]
    # WRITE — UPDATE and DELETE are owner-only per kb/02-user-roles.md
    # (members manage content inside the space, not the space itself).
    # CREATE requires the new owner to be the authenticated user — this
    # blocks the attack where a caller posts `owner.connect` pointing at
    # another Person's id to back-door themselves into someone else's
    # space. Legit creators (REST /api/we-space/create + csv-import-service)
    # already pass `user.id` as the owner, so this is invisible to them.
    validate: [
      {
        operations: [CREATE]
        where: { node: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
      }
      {
        operations: [UPDATE, DELETE]
        where: { node: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
      }
    ]
  ) {
  id: ID! @id
  name: String!
  visibility: SpaceVisibility!
  
  # Community properties
  description: String
  why: String
  location: String
  time: String
  activities: String
  resultsAchieved: String
  status: String
  
  createdAt: DateTime!
  owner: [Person!]! @relationship(type: "OWNS", direction: IN)
  members: [SpaceMembership!]! @relationship(type: "HAS_MEMBER", direction: OUT)
  # Nested DELETE/DISCONNECT are disabled (GOAL-319): a nested
  # `contexts: { delete: ... }` ran the same bare DETACH DELETE the removed
  # deleteFieldContexts mutation did (orphaning every nested pulse), and a
  # nested disconnect stranded the context invisible AND un-purgeable (the
  # purge cron matches on deletedAt, which a disconnect never sets). All
  # deletion flows through the custom `deleteFieldContext` mutation.
  contexts: [FieldContext!]!
    @relationship(
      type: "HAS_CONTEXT"
      direction: OUT
      nestedOperations: [CONNECT, CREATE, UPDATE]
    )
}

"""
Represents a person as a member of a space with a specific role.
Label: ["SpaceMembership"]
Authorization: Only accessible if current user is an owner or member of the associated space.
"""
type SpaceMembership
  @node(labels: ["SpaceMembership"])
  @authorization(
    filter: [
      {
        where: {
          node: {
            space_SOME: {
              OR: [
                # Current user is the owner of the space
                { owner_SOME: { id_EQ: "$jwt.user.id" } }
                # Current user is a member of the space
                { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } }
              ]
            }
          }
        }
      }
    ]
  ) {
  id: ID! @id
  role: SpaceRole!
  addedAt: DateTime!
  member: [Person!]! @relationship(type: "IS_MEMBER", direction: OUT)
  space: [Space!]! @relationship(type: "HAS_MEMBER", direction: IN)
}

# ============================================================================
# FIELD CONTEXTS (Thematic/Temporal Containers)
# ============================================================================

"""
A thematic or temporal container inside a Space.
Groups related pulses together.
Label: ["FieldContext"]

MIGRATION PATTERN:
- Each MeSpace gets at least one auto-created FieldContext for user's legacy pulses
- Default naming: "{User's name} Goals", "{User's name} Resources", etc.
- Each WeSpace (former Community) gets a FieldContext named "{Community name} Field"
- All pulses from direct relationships are migrated INTO these contexts
- ResonanceLinks represent relationships between pulses within the same context
"""
type FieldContext
  @node(labels: ["FieldContext"])
  # DELETE is custom-only (GOAL-319): the generated deleteFieldContexts ran a
  # bare DETACH DELETE on the context node, orphaning every nested pulse.
  # Deletion now flows through the custom `deleteFieldContext` mutation, which
  # soft-deletes the context and its pulses (deletedAt stamp + the Space edge
  # re-pointed to HAS_DELETED_CONTEXT) ahead of the 90-day purge cron.
  @mutation(operations: [CREATE, UPDATE])
  @authorization(
    # READ — anyone with access to the owning space (Me owner, or We
    # owner + any member regardless of role) can see the FieldContext.
    filter: [
      {
        where: {
          node: {
            OR: [
              { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              {
                meSpace_SOME: {
                  members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                }
              }
              { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              {
                weSpace_SOME: {
                  members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                }
              }
            ]
          }
        }
      }
    ]
    # WRITE — split per kb/02-user-roles.md:
    #   CREATE/UPDATE → owner, ADMIN, or MEMBER (GUESTs are view-only)
    #   DELETE        → owner or ADMIN only (members can't drop fields)
    validate: [
      {
        operations: [CREATE, UPDATE]
        where: {
          node: {
            OR: [
              { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              {
                weSpace_SOME: {
                  members_SOME: {
                    AND: [
                      { member_SOME: { id_EQ: "$jwt.user.id" } }
                      { role_IN: [ADMIN, MEMBER] }
                    ]
                  }
                }
              }
            ]
          }
        }
      }
      {
        operations: [DELETE]
        where: {
          node: {
            OR: [
              { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
              {
                weSpace_SOME: {
                  members_SOME: {
                    AND: [
                      { member_SOME: { id_EQ: "$jwt.user.id" } }
                      { role_EQ: ADMIN }
                    ]
                  }
                }
              }
            ]
          }
        }
      }
    ]
  ) {
  id: ID! @id
  title: String!
  emergentName: String
  createdAt: DateTime!
  createdBy: [Person!]! @relationship(type: "CREATED_BY", direction: OUT)
  # HAS_PERSON connects go through the custom `addPersonToFieldContext`
  # mutation, which gates `:User` targets (attaching a person to a context
  # unlocks their gated PII to the space via the Person contexts_SOME READ
  # branch — so a registered User may only be attached when they are the
  # caller or already own / belong to the context's parent Space). Only
  # DISCONNECT stays generated (RemovePersonFromFieldContext); an open nested
  # CONNECT let any context editor attach an arbitrary User by id.
  people: [Person!]!
    @relationship(
      type: "HAS_PERSON"
      direction: OUT
      nestedOperations: [DISCONNECT]
    )
  # Organizations attached to this context (GOAL-298). HAS_ORGANIZATION connects
  # go through the server-side ingest write only; open nested CONNECT is disabled
  # (parity with `people`) so a context editor can't rehome an arbitrary org by id.
  organizations: [Organization!]!
    @relationship(
      type: "HAS_ORGANIZATION"
      direction: OUT
      nestedOperations: [DISCONNECT]
    )
  pulses: [FieldPulse!]! @relationship(type: "HAS_PULSE", direction: OUT)
  documents: [Document!]! @relationship(type: "HAS_DOCUMENT", direction: OUT)
  resonances: [ResonanceLink!]!
    @relationship(type: "HAS_RESONANCE", direction: OUT)
  weaves: [PromiseWeave!]!
    @relationship(type: "HAS_WEAVE", direction: OUT)
  resonancesInContext: [ResonanceLink!]!
    @cypher(
      statement: """
      MATCH (this)-[:HAS_PULSE]->(pulse:FieldPulse)
      WITH this, collect(pulse) as contextPulses
      MATCH (source:FieldPulse)<-[:SOURCE]-(resonance:ResonanceLink)-[:TARGET]->(target:FieldPulse)
      WHERE source IN contextPulses AND target IN contextPulses
      RETURN DISTINCT resonance
      """
      columnName: "resonance"
    )
  meSpace: [MeSpace!]! @relationship(type: "HAS_CONTEXT", direction: IN)
  weSpace: [WeSpace!]! @relationship(type: "HAS_CONTEXT", direction: IN)
  space: [Space!]!
    @cypher(
      statement: """
      MATCH (this)<-[:HAS_CONTEXT]-(space:Space)
      RETURN space
      """
      columnName: "space"
    )
  owner: [Person!]!
    @cypher(
      statement: """
      MATCH (this)<-[:HAS_CONTEXT]-(space:Space)-[:OWNS]->(owner:Person)
      RETURN owner
      """
      columnName: "owner"
    )
}

# ============================================================================
# DOCUMENTS (Doc Ingestion Provenance — see GOAL-235 + ADR-0002)
# ============================================================================

"""
An uploaded source document attached to a FieldContext. Created by the
direct-to-S3 ingestion flow: POST /api/ingest/document/presign mints a
short-lived presigned PUT URL; the browser uploads straight to S3; POST
/api/ingest/document/process then anchors the Document node and runs
extraction. The original file lives in blob storage (`blobKey` / `blobUrl`);
the graph node carries metadata + provenance edges.

Authorization: inherits from the parent Space — same pattern as FieldContext.
Documents are never auto-deleted; cleanup is user-driven (slice 6 ships the
delete mutation).
"""
type Document
  @node(labels: ["Document"])
  @authorization(
    # READ — inherits from the parent FieldContext / Space.
    filter: [
      {
        where: {
          node: {
            fieldContext_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  meSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
              ]
            }
          }
        }
      }
    ]
    # WRITE — upload/edit/delete require owner, ADMIN, or MEMBER on
    # the owning space. GUESTs are excluded.
    validate: [
      {
        operations: [CREATE, UPDATE, DELETE]
        where: {
          node: {
            fieldContext_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: {
                      AND: [
                        { member_SOME: { id_EQ: "$jwt.user.id" } }
                        { role_IN: [ADMIN, MEMBER] }
                      ]
                    }
                  }
                }
              ]
            }
          }
        }
      }
    ]
  ) {
  id: ID! @id
  filename: String!
  mimeType: String!
  sizeBytes: Int!
  """Page count for paginated formats (.pdf). 1 for .txt/.md. Null when unknown (legacy uploads)."""
  pageCount: Int
  """Blob storage key. Internal — UI surfaces filename instead. Never exposed
  to any client: `@selectable(onRead: false)` removes it from read selection
  sets and `@filterable(byValue: false)` blocks value inference via filters
  (GOAL-302). The download route reads it server-side over raw Cypher, so the
  file stays reachable to members through the opaque `downloadUrl` only."""
  blobKey: String
    @selectable(onRead: false, onAggregate: false)
    @filterable(byValue: false, byAggregate: false)
  """Provider-issued URL for the blob. May be expiring/private — never returned
  to a client (GOAL-302); members open the file through `downloadUrl`. Same
  non-selectable / non-filterable gate as `blobKey`."""
  blobUrl: String
    @selectable(onRead: false, onAggregate: false)
    @filterable(byValue: false, byAggregate: false)
  """Durable, Space-scoped in-app link to open/download the uploaded file
  (GOAL-283). Stable per document — resolves through
  GET /api/ingest/document/<id>/download, which re-checks Space read access and
  mints a fresh presigned S3 URL on every hit. This is the permanent handle to
  the file; unlike blobUrl it never expires and is safe to share within the
  Space. Computed from the document id (see documentTypeResolvers.downloadUrl)."""
  downloadUrl: String @customResolver(requires: "id")
  """Optional one-line "What is this?" hint captured at upload. Reused on re-extract (slice 6)."""
  userHint: String
  """AI-generated 1-paragraph synopsis of the document content. Produced at
  ingest time by a dedicated summarization call (independent of the entity
  extraction model). Null if the call failed or was skipped — document still
  lands either way (failure is non-fatal). Refreshed on re-extract."""
  summary: String
  """Up to ~5 short concept phrases the AI surfaced as the document's
  high-level themes. Rendered as chips on the Document card so the user can
  see what the doc is *about* before scanning extracted entities. Empty when
  the summarizer returned nothing or the call failed."""
  concepts: [String!]
  uploadedAt: DateTime!
  fieldContext: [FieldContext!]! @relationship(type: "HAS_DOCUMENT", direction: IN)
  uploadedBy: [Person!]! @relationship(type: "UPLOADED_BY", direction: OUT)
  """People extracted from this document (provenance — see EXTRACTED_FROM)."""
  extractedPeople: [Person!]!
    @relationship(type: "EXTRACTED_FROM", direction: IN)
  """FieldPulses extracted from this document (provenance — see EXTRACTED_FROM)."""
  extractedPulses: [FieldPulse!]!
    @relationship(type: "EXTRACTED_FROM", direction: IN)
  """Ingest threads spawned from this document — initial upload + every Re-extract attempt. Ordered newest first."""
  ingestThreads: [DocumentIngestThread!]!
    @cypher(
      statement: """
      MATCH (this)-[:HAS_INGEST_THREAD]->(t:ConversationThread)
      RETURN {id: t.id, title: t.title, createdAt: toString(t.createdAt)} AS thread
      ORDER BY t.createdAt DESC
      """
      columnName: "thread"
    )
}

"""
Lightweight projection of a ConversationThread spawned by document ingestion.
We deliberately do not surface the underlying ConversationThread node as a
GraphQL type — its lifecycle is owned by the assistant subsystem, not the
graph schema.
"""
type DocumentIngestThread {
  id: ID!
  title: String!
  createdAt: String!
}

"""
Response payload for `reExtractDocument`. (The initial-upload mutation has
been replaced by the REST direct-to-S3 flow; see
`POST /api/ingest/document/presign` + `/process`.)
"""
type IngestDocumentResponse {
  documentId: ID!
  threadId: ID!
  """Number of entities (Persons + FieldPulses) the extractor proposed AND
  the server auto-executed against the graph. Equivalent to the count of
  successful tool calls in the synthesized assistant turn.
  See PRD § revised flow — uploads no longer wait on HITL approval."""
  createdEntityCount: Int!
  """Number of proposed entities whose auto-execution failed (validation,
  permission, or runtime errors). Surfaced in the ingest thread per
  call. Zero on the happy path."""
  failedEntityCount: Int!
}

"""Response payload for `deleteDocument`. The Document node and its blob are
removed; previously extracted Persons and FieldPulses are untouched (their
EXTRACTED_FROM edges drop with the Document)."""
type DeleteDocumentResponse {
  documentId: ID!
  deleted: Boolean!
}

"""Response payload for `deleteFieldContext` (GOAL-319). The context and its
pulses are soft deleted in one transaction — immediately hidden from every
read surface — and hard-purged with all nested content by the daily purge
cron once the 90-day retention window passes."""
type DeleteFieldContextResponse {
  contextId: ID!
  deleted: Boolean!
  """Number of pulses soft-deleted along with the context."""
  deletedPulseCount: Int!
}

# ============================================================================
# PULSES (First-Class Citizens - The Write Path)
# ============================================================================

"""
Base pulse type.
Represents a single contributed unit of meaning.
Authorization: Only accessible by users with access to the parent FieldContext's Space.
Never instantiate directly - use concrete types (GoalPulse, ResourcePulse, StoryPulse).
"""
interface FieldPulse {
  id: ID!
  title: String!
  content: String!
  createdAt: DateTime!
  intensity: Float
  createdBy: [Person!]! @declareRelationship
  """
  Canonical author edge, `(:FieldPulse)-[:INITIATED_BY]->(:Person)`,
  written by the assistant + doc-ingest paths (`lib/chat/hitl.ts`,
  `api/pulse/create-from-conversation`) — doc-ingested pulses point at
  the extracted author. `createdBy` carries the same meaning but is
  written by the dashboard create flow and the CSV/document imports, so
  NEITHER field alone covers all pulses: consumers must read both,
  preferring `initiatedBy` (see `resolvePulseAuthor` in
  `src/lib/pulse-author.ts`) or matching the Cypher alternation
  `[:INITIATED_BY|CREATED_BY]`.
  """
  initiatedBy: [Person!]! @declareRelationship
  context: [FieldContext!]! @declareRelationship
  """
  Documents this pulse was extracted from (doc-ingestion provenance — see GOAL-242 + ADR-0002).
  Empty for manually-created pulses. Returned newest-uploaded first.
  """
  extractedFrom: [Document!]! @declareRelationship
}

"""
A pulse that functions as a goal in its context.
Multi-label: ["FieldPulse", "GoalPulse"]
Merged properties from legacy Goal entity.
"""
type GoalPulse implements FieldPulse
  @node(labels: ["FieldPulse", "GoalPulse"])
  @authorization(
    # READ — inherits from the parent FieldContext / Space.
    filter: [
      {
        where: {
          node: {
            context_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  meSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } }
                  }
                }
              ]
            }
          }
        }
      }
    ]
    # WRITE — split per kb/02-user-roles.md operation matrix:
    #   CREATE/UPDATE → owner, ADMIN, or MEMBER on the owning space
    #   DELETE        → creator, owner, or ADMIN
    validate: [
      {
        operations: [CREATE, UPDATE]
        where: {
          node: {
            context_SOME: {
              OR: [
                { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                {
                  weSpace_SOME: {
                    members_SOME: {
                      AND: [
                        { member_SOME: { id_EQ: "$jwt.user.id" } }
                        { role_IN: [ADMIN, MEMBER] }
                      ]
                    }
                  }
                }
              ]
            }
          }
        }
      }
      {
        operations: [DELETE]
        where: {
          node: {
            OR: [
              # Creator self-delete (kb/02 matrix) must accept BOTH live
              # author edges: createdBy (dashboard flow, imports) and
              # initiatedBy (assistant + doc-ingest paths) — either alone
              # strands the other surface's creators.
              { createdBy_SOME: { id_EQ: "$jwt.user.id" } }
              { initiatedBy_SOME: { id_EQ: "$jwt.user.id" } }
              {
                context_SOME: {
                  OR: [
                    { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                    { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } }
                    {
                      weSpace_SOME: {
                        members_SOME: {
                          AND: [
                            { member_SOME: { id_EQ: "$jwt.user.id" } }
                            { role_EQ: ADMIN }
                          ]
                        }
                      }
                    }
                  ]
                }
              }
            ]
          }
        }
      }
    ]
  ) {
  id: ID! @id
  title: String!  # Mapped from legacy Goal.name
  content: String!  # Mapped from legacy Goal.description
  createdAt: DateTime!
  intensity: Float
  
  # Modern goal properties
  status: GoalStatus!
  horizon: GoalHorizon
  
  # Merged legacy Goal properties
  successMeasures: String
  photo: String
  activities: String
  type: String
  why: String
  location: String
  time: String
  
  createdBy: [Person!]! @relationship(type: "CREATED_BY", direction: OUT)
  initiatedBy: [Person!]! @relationship(type: "INITIATED_BY", direction: OUT)
  context: [FieldContext!]! @relationship(type: "HAS_PULSE", direction: IN)
  extractedFrom: [Document!]! @relationship(type: "EXTRACTED_FROM", direction: OUT)
}


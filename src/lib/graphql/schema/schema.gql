"""
A discovered semantic resonance link between two pulses within the same FieldContext.
Represents an AI-identified connection with confidence scoring.
Scoped to a single FieldContext - only pulses in the same context can resonate.
Multi-label: ["ResonanceLink"]

MIGRATION PATTERN:
- ResonanceLink.label should be set to the legacy relationship type name
- Legacy relationship types to preserve as labels:
  - MOTIVATED_BY (Person/Community → Goal)
  - APPLIED_TO (Goal ← Resource)
  - ALIGNED_TO (Goal → CoreValue)
  - ENABLES (Goal → CarePoint)
  - CARES_FOR (Goal ← CarePoint)
  - DEPENDS_ON (CarePoint → Resource)
  - EMBRACES (Person/Community → CoreValue)
  - PROVIDES (Person/Community → Resource)
  - HAS_ACCESS_TO (Community → Resource)
  - CONNECTED_TO (Person → Person, with why/interests in evidence)

Example:
  Legacy: Goal "Launch App" -[:APPLIED_TO]-> Resource "Developer Time"
  Migrated: GoalPulse "Launch App" <-[:SOURCE]- ResonanceLink {label: "APPLIED_TO"} -[:TARGET]-> ResourcePulse "Developer Time"
"""
type ResonanceLink @node(labels: ["ResonanceLink"]) {
  id: ID! @id
  label: String!
  description: String
  confidence: Float!
  evidence: String
  mergedFrom: String
  createdAt: DateTime!
  source: [FieldPulse!]! @relationship(type: "SOURCE", direction: OUT)
  target: [FieldPulse!]! @relationship(type: "TARGET", direction: OUT)
  context: [FieldContext!]! @relationship(type: "HAS_RESONANCE", direction: IN)
}

# ============================================================================
# ACTIVITY LOG
# ============================================================================

"""
Activity log for tracking changes and updates.
Preserved from reference schema for audit trail.

MIGRATION: Log entries reference pulses that now live in FieldContexts.
Logs maintain direct relationships to pulses for historical tracking,
but pulse discovery should go through Space → FieldContext → Pulse path.
"""
type Log @node(labels: ["Log"]) {
  id: ID! @id
  description: String!
  createdAt: DateTime!
    @timestamp(operations: [CREATE])
    @settable(onCreate: true, onUpdate: false)
  createdBy: [Person!]! @relationship(type: "CREATED_BY", direction: OUT)
  
  # Direct references to pulses (for audit trail)
  # NOTE: These pulses exist in FieldContexts within Spaces
  goals: [GoalPulse!]! @relationship(type: "LOGGED_FOR", direction: OUT)
  resources: [ResourcePulse!]! @relationship(type: "LOGGED_FOR", direction: OUT)
  pulses: [FieldPulse!]! @relationship(type: "LOGGED_FOR", direction: OUT)
}

# ============================================================================
# SEARCH LAYER (Cross-Entity Discovery)
# ============================================================================

"""
Structured response for categorized search results.
Returns up to 10 results of each entity type matching the search query.
"""
type SearchResults {
  people: [Person!]!
  meSpaces: [MeSpace!]!
  weSpaces: [WeSpace!]!
  contexts: [FieldContext!]!
  goalPulses: [GoalPulse!]!
  resourcePulses: [ResourcePulse!]!
  storyPulses: [StoryPulse!]!
  carePulses: [CarePulse!]!
  coreValuePulses: [CoreValuePulse!]!
}

# ============================================================================
# MUTATIONS (Custom Operations)
# ============================================================================

"""
Response from the chatbot containing the message and session ID.
"""
type ChatbotResponse {
  message: String!
  sessionId: String!
}

"""
Response when adding a member to a space.
"""
type AddSpaceMemberResponse {
  success: Boolean!
  message: String!
  membership: SpaceMembership
}

"""
Response when updating a space member's role.
"""
type UpdateSpaceMemberRoleResponse {
  success: Boolean!
  message: String!
  membership: SpaceMembership
}

"""
Response when removing a member from a space.
"""
type RemoveSpaceMemberResponse {
  success: Boolean!
  message: String!
}

"""
Response when updating user AI preferences.
"""
type UpdateUserAIResponse {
  success: Boolean!
  message: String!
  user: User
}

type Mutation {
  """
  Send a message to the chatbot and receive a response.
  """
  sendMessageToChatbot(message: String!, sessionId: String): ChatbotResponse

  """
  Invite a person to join the platform.
  Sends an invite email with a password reset link.
  """
  invitePerson(personId: String!): Person

  """
  Cancel an invitation for a person.
  Removes the User label and invite-related properties.
  """
  cancelInvite(personId: String!): Person

  """
  Add a member to a space with a specific role.
  Only the space owner or members with ADMIN role can add new members.
  """
  addSpaceMember(
    spaceId: ID!
    memberId: ID!
    role: SpaceRole!
  ): AddSpaceMemberResponse!

  """
  Update a space member's role.
  Only the space owner or members with ADMIN role can change roles.
  """
  updateSpaceMemberRole(
    spaceId: ID!
    memberId: ID!
    role: SpaceRole!
  ): UpdateSpaceMemberRoleResponse!

  """
  Remove a member from a space.
  Only the space owner or members with ADMIN role can remove members.
  Cannot remove the space owner.
  """
  removeSpaceMember(spaceId: ID!, memberId: ID!): RemoveSpaceMemberResponse!

  """
  Update AI functionality preferences for a user.
  Users can enable or disable AI features in the application.
  """
  updateUserAI(userId: ID!, aiEnabled: Boolean!): UpdateUserAIResponse!
  
  """
  Generate embeddings for a person's profile.
  Legacy mutation preserved for compatibility.
  """
  generatePersonEmbeddings(personId: ID!): Boolean!
}

# ============================================================================
# QUERIES
# ============================================================================

type Query {
  """
  Global federated search across all entity types.
  Searches using case-insensitive substring matching on:
    - Pulses: content field
    - People: firstName, lastName, email
    - Contexts: title field
    - Spaces (MeSpace/WeSpace): name field (filtered by user ownership/membership)

  Space Filtering:
    - Only returns spaces where the current user is the owner OR a member with any role (ADMIN, MEMBER, or GUEST)
    - Private spaces not owned or joined by the user are excluded from results

  Args:
    - query: Search term (required, case-insensitive substring match)

  Returns: SearchResults with up to 10 results of each entity type
  """
  searchAll(query: String!): SearchResults
  
  """
  Find a user by email address for member addition.
  Bypasses authorization restrictions to allow space owners to add any registered user.
  Returns null if no user found with the given email.
  
  Args:
    - email: Email address to search for (case-sensitive exact match)
    
  Returns: User object or null
  """
  findUserByEmail(email: String!): User
  
  """
  Returns people related to the current user.
  For use in dashboard - shows only people connected through spaces or direct connections.
  
  Includes:
    - The current user themselves
    - People who own spaces where current user is owner or member
    - People who are members of spaces where current user is owner or member
    - Direct connections to the current user
    
  Returns: Array of Person objects
  """
  relatedPeople: [Person!]!
  
  # ============================================================================
  # LEGACY SUBSTRING QUERIES (Preserved for backward compatibility)
  # ============================================================================
  
  """
  Search for people by substring match on firstName or lastName.
  LEGACY: Consider using searchAll for unified search experience.
  """
  peopleSubstringSearch(key: String!): [Person!]!
    @cypher(
      statement: """
      MATCH (person:Person)
      WHERE toLower(person.firstName) CONTAINS toLower($key) 
        OR toLower(person.lastName) CONTAINS toLower($key)
      RETURN person
      """
      columnName: "person"
    )
  
  """
  Search for goals by substring match on title or content.
  LEGACY: Consider using searchAll for unified search experience.
  """
  goalSubstringSearch(key: String!): [GoalPulse!]!
    @cypher(
      statement: """
      MATCH (goal:GoalPulse)
      WHERE toLower(goal.title) CONTAINS toLower($key)
        OR toLower(goal.content) CONTAINS toLower($key)
      RETURN goal
      """
      columnName: "goal"
    )
  
  """
  Search for resources by substring match on title or content.
  LEGACY: Consider using searchAll for unified search experience.
  """
  resourceSubstringSearch(key: String!): [ResourcePulse!]!
    @cypher(
      statement: """
      MATCH (resource:ResourcePulse)
      WHERE toLower(resource.title) CONTAINS toLower($key)
        OR toLower(resource.content) CONTAINS toLower($key)
      RETURN resource
      """
      columnName: "resource"
    )
  
  """
  Search for story pulses (including care points & core values) by substring match on title or content.
  LEGACY: Consider using searchAll for unified search experience.
  """
  storyPulseSubstringSearch(key: String!): [StoryPulse!]!
    @cypher(
      statement: """
      MATCH (story:StoryPulse)
      WHERE toLower(story.title) CONTAINS toLower($key)
        OR toLower(story.content) CONTAINS toLower($key)
      RETURN story
      """
      columnName: "story"
    )
  
  """
  Search for care points (now StoryPulse, identified by having CarePoint-specific fields).
  LEGACY: Consider using searchAll for unified search experience.
  """
  carePointSubstringSearch(key: String!): [StoryPulse!]!
    @cypher(
      statement: """
      MATCH (carePoint:StoryPulse)
      WHERE (carePoint.levelFulfilled IS NOT NULL OR carePoint.issuesIdentified IS NOT NULL)
        AND (toLower(carePoint.title) CONTAINS toLower($key)
          OR toLower(carePoint.content) CONTAINS toLower($key))
      RETURN carePoint
      """
      columnName: "carePoint"
    )
  
  """
  Search for core values (now StoryPulse, identified by having CoreValue-specific fields).
  LEGACY: Consider using searchAll for unified search experience.
  """
  coreValueSubstringSearch(key: String!): [StoryPulse!]!
    @cypher(
      statement: """
      MATCH (coreValue:StoryPulse)
      WHERE (coreValue.alignmentChallenges IS NOT NULL OR coreValue.alignmentExamples IS NOT NULL)
        AND (toLower(coreValue.title) CONTAINS toLower($key)
          OR toLower(coreValue.content) CONTAINS toLower($key))
      RETURN coreValue
      """
      columnName: "coreValue"
    )
}

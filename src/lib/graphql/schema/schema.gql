# GoalPost GraphQL Schema - Unified Schema (Main + Reference Merged)
# Designed for pulse-first, context-aware relational data modeling.
#
# Architecture:
# - Pulses are the write path (first-class citizens)
# - Resonance is the read/insight path (AI-generated meaning)
# - Spaces define privacy boundaries (MeSpace/WeSpace)
# - AI adds meaning after the fact (explainability layer)
#
# Migration Notes:
# - Legacy Goals → GoalPulse (in FieldContext within MeSpace/WeSpace)
# - Legacy Resources → ResourcePulse (in FieldContext within MeSpace/WeSpace)
# - Legacy CoreValues → CoreValuePulse (GOAL-287; migrated nodes also keep :CoreValue for provenance)
# - Legacy CarePoints → PromiseWeave connector nodes (GOAL-266); StoryPulse still declares their optional fields for any un-migrated rows
# - Legacy Communities → WeSpaces (properties merged into Space interface)
# - Direct relationships → ResonanceLinks (AI-discovered patterns within FieldContext)
#
# PULSE ACCESS PATTERN:
# - Pulses are ONLY shown in FieldContexts
# - User pulses → FieldContext in auto-created MeSpace ("{User's name} MeSpace")
# - Community pulses → FieldContext in WeSpace ("{Community name} Field")
# - Pulse-to-pulse relationships → ResonanceLinks within the same FieldContext
#
# MIGRATION EXAMPLE:
# Person "Alice" with Goal "Launch App" → 
#   1. Create MeSpace "Alice MeSpace"
#   2. Create FieldContext "Alice's Goals" in MeSpace
#   3. Create GoalPulse "Launch App" in FieldContext
#   4. Related pulses get ResonanceLinks in same context

extend schema @authentication

# ============================================================================
# ENUMS
# ============================================================================

enum Status {
  ACTIVE
  INACTIVE
  PENDING
}

enum GoalStatus {
  ACTIVE
  PAUSED
  COMPLETED
}

enum GoalHorizon {
  SHORT
  MID
  LONG
}

enum SpaceRole {
  ADMIN
  MEMBER
  GUEST
}

enum SpaceVisibility {
  PRIVATE
  SHARED
}

# ============================================================================
# RELATIONSHIP PROPERTIES
# ============================================================================

"""
Properties for person-to-person connections.
Now represented via ResonanceLinks with these metadata properties.
"""
type ConnectedTo @relationshipProperties {
  why: String
  interests: String
}

"""
Flat edge type used to expose CONNECTED_TO relationship properties alongside the connected person ID.
Returned by Person.connectionEdges via Cypher to avoid nesting issues with @cypher + @relationship.
"""
type PersonConnectionEdge {
  connectedPersonId: String!
  why: String
  interests: String
}



# ============================================================================
# CORE ACTORS (Who initiates pulses & owns spaces)
# ============================================================================

"""
Base interface for Person entities.
Defines common properties across Person and User types.

`@query(read: false, aggregate: false)`: the GOAL-275 PII gate lives on the
concrete `Person` type (field-level `@authorization` READ + `@selectable`
onAggregate:false). Those do NOT flow to the interface's auto-generated roots
(`personInterfaces`, `personInterfacesAggregate`, `personInterfacesConnection`),
which read the same `:Person` nodes with NO authorization — a cross-Space leak
of email/phone/location/pronouns to any authenticated user. Disabling the
interface roots closes that parallel path; the app never queries them (all
Person access goes through `people` / `relatedPeople`). Mirrors the `User`
type lock. If a new gated field is added to `Person`, this stays sufficient.
"""
interface PersonInterface @query(read: false, aggregate: false) {
  id: ID!
  firstName: String!
  lastName: String!
  name: String!
  photo: String
  phone: String
  email: String
  pronouns: String
  location: String
  createdAt: DateTime!
  updatedAt: DateTime
}

"""
A human user of the system.
Multi-label: ["Person", "User"]
Authorization: Any authenticated user can view any Person (allows profile viewing after search).
Dashboard filtering is handled in queries, not authorization.
Merged properties from reference schema for backward compatibility.
"""
type Person implements PersonInterface
  @node(labels: ["Person"])
  @authorization(
    # WRITE — a Person may only be updated or deleted by the user it
    # represents. This closes the IDOR where any authenticated caller could
    # updatePeople(where: { id_EQ: <victim> }) / deletePeople and overwrite
    # another person's profile. READ stays open: any authenticated user can
    # look up a Person (directory lookup, per kb/02-user-roles.md). CREATE is
    # intentionally not gated — Person nodes are created by the trusted
    # server-side auth routes via direct Cypher, never this mutation.
    validate: [
      {
        operations: [UPDATE, DELETE]
        where: { node: { id_EQ: "$jwt.user.id" } }
      }
    ]
  ) {
  id: ID! @id
  isUser: Boolean
    @cypher(
      statement: """
      MATCH (this) WHERE this:User
      RETURN true AS isUser
      """
      columnName: "isUser"
    )
  
  # Core identity properties
  firstName: String!
  lastName: String!
  name: String! @customResolver(requires: "firstName lastName")

  # ── GOAL-275 sensitive-field READ gate ─────────────────────────────────────
  # The Person type stays open for directory lookup: id / firstName / lastName /
  # name / photo are readable by any authenticated user (kb/02-user-roles.md).
  # The fields below carry PII or relational narrative and MUST NOT leak across
  # Space boundaries. Each carries an identical field-level `@authorization`
  # `filter` rule that authorizes the read only when the caller
  #   • is the person           (id_EQ $jwt.user.id), OR
  #   • created the person node  (createdBy_SOME id_EQ $jwt.user.id — their own
  #                               imported / ingested contact), OR
  #   • shares a Space with them (co-owner or co-member of any Space they own /
  #                               belong to), OR
  #   • can view a FieldContext that holds them (contexts_SOME — the person is
  #     attached via HAS_PERSON to a FieldContext whose parent Space the caller
  #     owns or is a member of). This is the ONLY Space tie a PersonPulse has:
  #     relational-world people own no Space and hold no SpaceMembership, so
  #     without this branch every ingest/assistant-created person was filtered
  #     out of any query selecting a gated field — including for the very user
  #     who created them in their own MeSpace (the "uploaded a document but the
  #     people never appeared" failure). The branch mirrors FieldContext's own
  #     READ filter, so it authorizes exactly the people the caller could
  #     already reach by opening that context. No cross-Space widening for
  #     PersonPulses; for `:User` persons, PII reach equals context reach, so
  #     the HAS_PERSON attach side is gated to match: the generated nested
  #     CONNECT is disabled (FieldContext.people / Person.contexts carry
  #     `nestedOperations: [DISCONNECT]`), and the sole attach path — the
  #     custom `addPersonToFieldContext` mutation — refuses a `:User` target
  #     unless they are the caller or already own / belong to the context's
  #     parent Space. The declarative filter here cannot express "NOT :User",
  #     which is exactly why that guard lives in the resolver, not this rule.
  #
  # MECHANISM (important — @neo4j/graphql v6): a field-level `filter` rule is
  # ANDed onto the PARENT Person's match *whenever that field appears in the
  # selection set*. It does NOT null just the one field — an unauthorized caller
  # who selects any gated field does not receive the Person row at all (it is
  # filtered out). Consequences, by design:
  #   • Directory/search queries that select ONLY the open fields
  #     (id/firstName/lastName/name/photo) never trigger the rule, so every
  #     Person is still findable by name cross-Space.
  #   • A query that selects a gated field (the Person / Connection drawers,
  #     the profile page) returns the Person to authorized callers and an EMPTY
  #     result to everyone else — so every such surface MUST render a graceful
  #     not-found. `filter` (not `validate`) is used so this fails closed by
  #     omission rather than erroring the whole operation.
  # This is fail-closed and leak-free; it is a deliberately stricter posture
  # than "show name+photo, hide the sensitive bits" (which the declarative
  # filter cannot express without a raw projection).
  #
  # AGGREGATION: the filter rules cover READ only, and field-level rules do NOT
  # gate aggregate selections — `peopleAggregate { email { shortest } }` was
  # confirmed to return real cross-Space emails. Every gated scalar therefore
  # also carries `@selectable(onRead: true, onAggregate: false)`, which removes
  # it from ALL aggregate selection types (top-level and nested) at schema-build
  # time — fail-closed by construction. Plain `count` aggregates are
  # unaffected (the app currently issues no aggregate selections at all —
  # the last one, GET_GRAPH_STATS, was removed with the dead Graph View
  # queries). If you add a new gated field, add BOTH directives.
  #
  # The predicate reuses the exact owner/member pattern from the WeSpace +
  # SpaceMembership authorization filters above, over the pre-existing
  # `ownsSpaces` / `memberOf` / `createdBy` relationships — so it adds NO new
  # filter surface (all three are already declared `@relationship` fields on
  # this type, so their `*_SOME` filters already exist in PersonWhere).
  # The `createdBy_SOME` branch closes the regression where a user could not
  # open the profile of a non-member contact they themselves imported/ingested
  # (e.g. a document-extracted PersonPulse): such a contact owns no Space and is
  # a member of none, so the owner/member branches miss it, yet it is created
  # by — and belongs to — the caller. It only ever unlocks persons the caller
  # created, and CREATED_BY edges are written server-side (never via the
  # self-gated updatePeople), so it cannot be forged to reach a stranger's PII.
  # A legacy CONNECTED_TO edge, by contrast, does NOT unlock these fields:
  # expressing "caller is connected to this person" declaratively would require
  # adding a CONNECTED_TO relationship filter to PersonWhere, which `people(where:)`
  # would then expose for cross-Space connection-graph enumeration — re-opening
  # the very leak this ticket closes. CONNECTED_TO is legacy (migrating to
  # ResonanceLinks), so createdBy / sharing a Space are the intended paths to a
  # person's private profile.
  # Keep the OR-branches byte-identical on every gated field — a drifted copy
  # is a leak.
  # ────────────────────────────────────────────────────────────────────────────
  # NOTE: `email` stays filterable — `people(where: { email_EQ })` is the
  # self-bootstrap lookup (GET_LOGGED_IN_USER). Its value is still gated by the
  # @authorization filter below; only the exact-match filter capability remains.
  email: String
    @selectable(onRead: true, onAggregate: false)
    @authorization(filter: [{ operations: [READ], where: { node: { OR: [
      { id_EQ: "$jwt.user.id" }
      { createdBy_SOME: { id_EQ: "$jwt.user.id" } }
      { ownsSpaces_SOME: { OR: [ { owner_SOME: { id_EQ: "$jwt.user.id" } } { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } ] } }
      { memberOf_SOME: { space_SOME: { OR: [ { owner_SOME: { id_EQ: "$jwt.user.id" } } { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } ] } } }
      { contexts_SOME: { OR: [ { meSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } } { meSpace_SOME: { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } } { weSpace_SOME: { owner_SOME: { id_EQ: "$jwt.user.id" } } } { weSpace_SOME: { members_SOME: { member_SOME: { id_EQ: "$jwt.user.id" } } } } ] } }
    ] } } }])

  # Profile properties (merged from reference).
  # photo/avatar/status stay open (directory / presence — non-PII); the PII
  # scalars — including `gender`, which is collected on the person forms — carry
  # the GOAL-275 gate below.
  photo: String
